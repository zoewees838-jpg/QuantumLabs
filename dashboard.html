<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Quantum Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      color: #333;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      color: white;
      padding: 15px 25px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-danger {
      background-color: #ef4444;
    }
    .btn-secondary {
      background-color: #64748b;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .status-msg {
      margin-top: 10px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Bar -->
    <div class="header">
      <h2>Quantum Lab Dashboard</h2>
      <button id="logout-btn" class="btn btn-danger">Log Out</button>
    </div>

    <!-- User Profile Overview -->
    <div class="card">
      <h3>User Profile</h3>
      <p style="margin-top: 10px;"><strong>Email:</strong> <span id="user-email">Loading...</span></p>
      <p style="margin-top: 5px;"><strong>User ID:</strong> <span id="user-uid" style="font-family: monospace;">Loading...</span></p>
      <p style="margin-top: 5px;"><strong>Account Created:</strong> <span id="user-created">Loading...</span></p>
    </div>

    <!-- Quick Actions Grid -->
    <div class="grid">
      <div class="card">
        <h3>Quick Actions</h3>
        <p style="margin: 10px 0; font-size: 0.9em;">Manage your security settings directly from here.</p>
        <button id="reset-pwd-btn" class="btn btn-secondary">Send Password Reset Email</button>
        <p id="action-status" class="status-msg"></p>
      </div>

      <div class="card">
        <h3>Lab Workspace</h3>
        <p style="margin: 10px 0; font-size: 0.9em;">Access your project modules and experiments.</p>
        <button id="copy-uid-btn" class="btn">Copy User ID</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      onAuthStateChanged, 
      signOut, 
      sendPasswordResetEmail 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCf_NZ7EWHWEUt8OIrcHMAu0ffmSLNx_5s",
      authDomain: "nexoraauth-f1692.firebaseapp.com",
      projectId: "nexoraauth-f1692",
      storageBucket: "nexoraauth-f1692.firebasestorage.app",
      messagingSenderId: "222499366415",
      appId: "1:222499366415:web:958bd87b357cf8b77d657a",
      measurementId: "G-TX7N006I"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const userEmail = document.getElementById('user-email');
    const userUid = document.getElementById('user-uid');
    const userCreated = document.getElementById('user-created');
    const logoutBtn = document.getElementById('logout-btn');
    const resetPwdBtn = document.getElementById('reset-pwd-btn');
    const copyUidBtn = document.getElementById('copy-uid-btn');
    const actionStatus = document.getElementById('action-status');

    let currentUser = null;

    // Monitor Auth State
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        userEmail.textContent = user.email;
        userUid.textContent = user.uid;
        userCreated.textContent = user.metadata.creationTime ? new Date(user.metadata.creationTime).toLocaleDateString() : 'N/A';
      } else {
        // Redirect to login page if user is not authenticated
        const currentPath = window.location.pathname;
        const directory = currentPath.substring(0, currentPath.lastIndexOf('/'));
        window.location.href = `${window.location.origin}${directory}/index.html`;
      }
    });

    // Logout Functionality
    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (error) {
        alert("Logout failed: " + error.message);
      }
    });

    // Password Reset Action
    resetPwdBtn.addEventListener('click', async () => {
      if (currentUser && currentUser.email) {
        try {
          await sendPasswordResetEmail(auth, currentUser.email);
          actionStatus.textContent = "Password reset link sent to " + currentUser.email;
          actionStatus.style.color = "green";
        } catch (error) {
          actionStatus.textContent = error.message;
          actionStatus.style.color = "red";
        }
      }
    });

    // Copy UID Action
    copyUidBtn.addEventListener('click', () => {
      if (currentUser) {
        navigator.clipboard.writeText(currentUser.uid);
        alert("User ID copied to clipboard!");
      }
    });
  </script>
</body>
</html>
