<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantum Labs</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Quantum Labs</h1>
  </header>

  <main>
    <div id="auth-container" style="max-width: 400px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
      <h2>Account Access</h2>
      <input type="email" id="email-input" placeholder="Enter your email" style="width: 100%; padding: 8px; margin-bottom: 10px;" required />
      <input type="password" id="password-input" placeholder="Enter your password" style="width: 100%; padding: 8px; margin-bottom: 10px;" required />
      
      <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <button id="login-btn" style="flex: 1; padding: 10px;">Log In</button>
        <button id="signup-btn" style="flex: 1; padding: 10px;">Sign Up</button>
      </div>
      
      <p id="auth-status" style="font-weight: bold; color: #333;"></p>
    </div>
  </main>

  <footer>
    <p>© 2026 Nexora. All rights reserved.</p>
    <p>Information provided by Nexora is for educational purposes only.</p>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
